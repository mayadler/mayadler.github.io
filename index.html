<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Football Injury Risk Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;400;600&family=DM+Mono&display=swap" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    background: #ffffff;
    color: #0d1a3a;
  }

  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(3rem, 8vw, 7rem);
    line-height: 1;
  }

  em {
    color: #1e50dc;
    font-style: italic;
  }

  /* animation styles */
  #rotating-word {
    display: inline-block;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .word-exit {
    opacity: 0;
    transform: translateY(-10px);
  }

  .word-enter {
    opacity: 0;
    transform: translateY(10px);
  }

  .word-enter-active {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>

<div class="hero">
  <h1>
    predict.
    <em><span id="rotating-word">protect</span></em>.
    perform.
  </h1>
</div>

<script>
const words = [
  "protect",
  "defend",
  "shield",
  "secure",
  "guard",
  "preserve"
];

let index = 0;
const el = document.getElementById("rotating-word");

setInterval(() => {
  el.classList.add("word-exit");

  setTimeout(() => {
    index = (index + 1) % words.length;
    el.textContent = words[index];

    el.classList.remove("word-exit");
    el.classList.add("word-enter");

    setTimeout(() => {
      el.classList.add("word-enter-active");
    }, 10);

    setTimeout(() => {
      el.classList.remove("word-enter", "word-enter-active");
    }, 400);

  }, 400);

}, 2500);
</script>

</body>
</html>
